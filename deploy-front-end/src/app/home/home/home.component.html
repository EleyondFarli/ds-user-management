<div class="container">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
      <!-- Displayed Columns -->
      <ng-container matColumnDef="deviceID">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> {{"deviceID" | titlecase}} </th>
        <td mat-cell *matCellDef="let device"> {{device.deviceID}} </td>
      </ng-container>

      <!-- Lastname Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{"description" | titlecase}}</th>
        <td mat-cell *matCellDef="let device"> {{device.description}} </td>
      </ng-container>

      <!-- Username Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>  {{"address" | titlecase}} </th>
        <td mat-cell *matCellDef="let device"> {{device.address}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="maxHourlyEnergyConsumption">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>  {{"maxHourlyEnergyConsumption" | titlecase}} </th>
        <td mat-cell *matCellDef="let device"> {{device.maxHourlyEnergyConsumption}} </td>
      </ng-container>

      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Data Rows -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 10, 5]" aria-label="Select page of devices"></mat-paginator>
  </div>
  <button mat-raised-button color="warn" (click)="logout()">Logout</button>
</div>
